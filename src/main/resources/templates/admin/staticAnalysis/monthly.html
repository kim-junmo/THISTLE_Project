<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/adminlayout}">

<th:block layout:fragment="content">
    <div class="content-wrapper">
        <section class="content-header">
            <h1>월별 매출현황 <small>취소된 주문은 제외</small></h1>
        </section>

        <section class="content">

            <div class="box box-primary">
                <div class="box-header with-border">
                    <form action="/admin/staticAnalysis/monthly" method="get" class="form-inline">
                        <label for="year">연도</label>
                        <select id="year" name="year" class="form-control input-sm" onchange="this.form.submit()">
                            <option th:each="y : ${year_list}" th:value="${y}" th:text="${y + '년'}" th:selected="${y == year}"></option>
                        </select>
                    </form>
                    <div class="box-tools" style="top: 12px;">
                        <span>총 매출 <strong th:text="${#numbers.formatInteger(total_sales, 1, 'COMMA') + '원'}"></strong></span>
                        &nbsp;·&nbsp;
                        <span>주문 <strong th:text="${total_orders + '건'}"></strong></span>
                    </div>
                </div>
                <div class="box-body">
                    <div style="position: relative; height: 340px;">
                        <canvas id="monthlyChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="box box-default">
                <div class="box-body no-padding">
                    <table class="table table-striped table-condensed">
                        <tr>
                            <th>월</th>
                            <th class="text-right">주문 건수</th>
                            <th class="text-right">매출</th>
                            <th class="text-right">건당 평균</th>
                        </tr>
                        <tr th:each="m : ${monthly_list}">
                            <td th:text="${m.month + '월'}"></td>
                            <td class="text-right" th:text="${m.order_count}"></td>
                            <td class="text-right" th:text="${#numbers.formatInteger(m.sales, 1, 'COMMA') + '원'}"></td>
                            <td class="text-right" th:text="${m.order_count == 0 ? '-' : #numbers.formatInteger(m.sales / m.order_count, 1, 'COMMA') + '원'}"></td>
                        </tr>
                    </table>
                </div>
            </div>

        </section>
    </div>
</th:block>

<th:block layout:fragment="script">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        $(document).ready(function() {
            const monthly = /*[[${monthly_list}]]*/ [];

            new Chart(document.getElementById("monthlyChart"), {
                data: {
                    labels: monthly.map(m => m.month + "월"),
                    datasets: [
                        {
                            type: "bar",
                            label: "매출(원)",
                            data: monthly.map(m => m.sales),
                            backgroundColor: "rgba(60, 141, 188, 0.7)",
                            yAxisID: "ySales"
                        },
                        {
                            type: "line",
                            label: "주문 건수",
                            data: monthly.map(m => m.order_count),
                            borderColor: "#f39c12",
                            backgroundColor: "#f39c12",
                            tension: 0.3,
                            yAxisID: "yCount"
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: "index", intersect: false },
                    scales: {
                        ySales: {
                            position: "left",
                            beginAtZero: true,
                            ticks: { callback: v => v.toLocaleString() + "원" }
                        },
                        yCount: {
                            position: "right",
                            beginAtZero: true,
                            grid: { drawOnChartArea: false },
                            ticks: { precision: 0 }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: ctx => ctx.dataset.yAxisID === "ySales"
                                    ? " 매출 " + ctx.parsed.y.toLocaleString() + "원"
                                    : " 주문 " + ctx.parsed.y + "건"
                            }
                        }
                    }
                }
            });
        });
    </script>
</th:block>
</html>
