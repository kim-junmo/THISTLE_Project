<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/adminlayout}">

<th:block layout:fragment="content">
    <div class="content-wrapper">
        <section class="content-header">
            <h1>관리자 등록 <small>새 관리자 계정을 만듭니다</small></h1>
        </section>

        <section class="content">
            <div class="row">
                <div class="col-md-6">
                    <div class="box box-primary">
                        <div class="box-header with-border">
                            <h3 class="box-title">관리자 정보</h3>
                        </div>

                        <form id="joinForm" action="/admin/join" method="post">
                            <div class="box-body">
                                <div class="form-group">
                                    <label for="admin_id">아이디</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="admin_id" name="admin_id" maxlength="20" placeholder="영문/숫자 4~20자" required>
                                        <span class="input-group-btn">
                                            <button type="button" class="btn btn-default" id="btn_idcheck">중복확인</button>
                                        </span>
                                    </div>
                                    <p class="help-block" id="idcheck_msg"></p>
                                </div>
                                <div class="form-group">
                                    <label for="admin_pw">비밀번호</label>
                                    <input type="password" class="form-control" id="admin_pw" name="admin_pw" placeholder="8자 이상" required>
                                </div>
                                <div class="form-group">
                                    <label for="admin_pw_confirm">비밀번호 확인</label>
                                    <input type="password" class="form-control" id="admin_pw_confirm" required>
                                </div>
                                <div class="form-group">
                                    <label for="admin_dept">부서</label>
                                    <input type="text" class="form-control" id="admin_dept" name="admin_dept" maxlength="30">
                                </div>
                                <div class="form-group">
                                    <label for="admin_email">이메일</label>
                                    <input type="email" class="form-control" id="admin_email" name="admin_email" maxlength="50">
                                </div>
                                <div class="form-group">
                                    <label for="admin_phone">연락처</label>
                                    <input type="text" class="form-control" id="admin_phone" name="admin_phone" maxlength="20" placeholder="010-0000-0000">
                                </div>
                            </div>

                            <div class="box-footer">
                                <button type="submit" class="btn btn-primary">등록</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>
</th:block>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        $(document).ready(function() {

            let msg = [[${msg}]];
            if (msg == "duplicateID") {
                alert("이미 사용 중인 아이디입니다.");
            }

            // 중복확인을 통과한 아이디. 아이디를 바꾸면 다시 확인해야 한다.
            let checkedId = "";

            $("#admin_id").on("input", function() {
                checkedId = "";
                $("#idcheck_msg").text("");
            });

            $("#btn_idcheck").on("click", function() {
                let admin_id = $("#admin_id").val().trim();

                if (!/^[A-Za-z0-9]{4,20}$/.test(admin_id)) {
                    alert("아이디는 영문/숫자 4~20자로 입력하세요.");
                    $("#admin_id").focus();
                    return;
                }

                $.ajax({
                    url: '/admin/idcheck',
                    type: 'get',
                    data: { admin_id: admin_id },
                    dataType: 'text',
                    success: function(result) {
                        if (result == "yes") {
                            checkedId = admin_id;
                            $("#idcheck_msg").css("color", "green").text("사용할 수 있는 아이디입니다.");
                        } else {
                            checkedId = "";
                            $("#idcheck_msg").css("color", "red").text("이미 사용 중인 아이디입니다.");
                        }
                    },
                    error: function() {
                        alert("중복확인 중 오류가 발생했습니다.");
                    }
                });
            });

            $("#joinForm").on("submit", function(e) {
                if (checkedId == "" || checkedId != $("#admin_id").val().trim()) {
                    e.preventDefault();
                    alert("아이디 중복확인을 해주세요.");
                    return;
                }
                if ($("#admin_pw").val().length < 8) {
                    e.preventDefault();
                    alert("비밀번호는 8자 이상 입력하세요.");
                    $("#admin_pw").focus();
                    return;
                }
                if ($("#admin_pw").val() != $("#admin_pw_confirm").val()) {
                    e.preventDefault();
                    alert("비밀번호가 일치하지 않습니다.");
                    $("#admin_pw_confirm").focus();
                }
            });
        });
    </script>
</th:block>
</html>
