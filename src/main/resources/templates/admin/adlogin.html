<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">  
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>THISTLE | 관리자페이지</title>
  <!-- Tell the browser to be responsive to screen width -->
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">  

<link rel="stylesheet" href="/css/adLogin.css">

</head>
<body>
<div class="main">
	<div class="container">
		<div style="text-align: center;">
			<div class="middle">
			
			<div id="login">
				<form action="/admin/admin_ok" method="post">
					<fieldset class="clearfix">
					<p>
						<span class="fa fa-user"></span>
						<input type="text" name="admin_id" id="admin_id" Placeholder="Username" required>
					</p> <!-- JS because of IE support; better: placeholder="Username" -->
					<p>
						<span class="fa fa-lock"></span>
						<input type="password" name="admin_pw" id="admin_pw" Placeholder="Password" required>
					</p> <!-- JS because of IE support; better: placeholder="Password" -->
					<div>
						<span style="width:48%; text-align:left;  display: inline-block;">
							<!-- 등록된 관리자가 한 명도 없을 때만 최초 관리자 등록 링크를 보여준다 -->
							<a class="small-text" href="/admin/join" th:if="${first_admin}">최초 관리자 등록</a>
						</span>
						<span style="width:50%; text-align:right;  display: inline-block;">
							<input type="submit" value="Sign In">
						</span>
					</div>
					</fieldset>
					<div class="clearfix"></div>
				</form>
				<div class="clearfix"></div>
			</div> <!-- end login -->
			<div class="logo">THISTLE
				<div class="clearfix"></div>
			</div>
			</div>
		</div>
	</div>
</div>

<th:block layout:fragment="script">
	<script th:inline="javascript">
		let msg = [[${msg}]];
		if(msg == "failID") {
			alert("아이디를 정확히 입력하세요");
			document.getElementById("admin_id").focus();
		}else if(msg == "failPW") {
			alert("비밀번호를 정확히 작성해주세요.");
			document.getElementById("admin_pw").focus();
		}
	</script>
</th:block>
 
</body>
</html>
